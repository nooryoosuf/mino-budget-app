name: Android APK (debug)

# Manual build: Actions tab → "Android APK (debug)" → Run workflow.
# Produces an installable debug APK (sideload-ready, free) with the
# 455 SMS-consent watcher baked in. No Play account needed.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Runners already ship an Android SDK — just accept licenses and make
      # sure API 36 + build-tools exist (setup-android@v3 is broken on new
      # runners: it demands the long-removed "tools" package).
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mino-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
